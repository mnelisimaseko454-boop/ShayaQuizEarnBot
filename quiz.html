<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shaya Quiz Earn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{font-family:sans-serif;background:#0f172a;color:#fff;text-align:center;padding:20px}button{background:#facc15;color:#000;border:0;padding:12px 20px;border-radius:12px;font-weight:700;margin:6px;cursor:pointer}.card{background:#1e293b;padding:16px;border-radius:16px;margin:10px 0}</style>
</head><body>
<h1>🎯 Shaya Quiz Earn</h1>
<div class="card"><div id="name">Player</div><div>Points: <b id="points">0</b> | Play: <b id="play">0</b> | Daily: <b id="daily">0</b></div></div>
<div class="card"><button onclick="claimDaily()">🎁 CLAIM 200 DAILY FREE</button><br><button onclick="playQuiz()">▶️ PLAY QUIZ (+10 per correct)</button></div>
<div class="card"><div id="q">Tap PLAY to start</div><div id="answers"></div></div>
<div class="card"><button onclick="withdraw()">💸 WITHDRAW (10000 pts)</button> <button onclick="showLeaderboard()">🏆 LEADERBOARD</button><div id="board"></div></div>
<script>
let tg = window.Telegram?.WebApp;
let myId = null, myName = 'Player';
if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
  myId = String(tg.initDataUnsafe.user.id);
  myName = tg.initDataUnsafe.user.first_name || 'Player';
  tg.ready(); tg.expand();
} else {
  // WEBSITE MODE - persistent device ID like Watch backup
  myId = localStorage.getItem('shaya_quiz_device_id');
  if (!myId) { myId = 'web_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); localStorage.setItem('shaya_quiz_device_id', myId); }
  myName = localStorage.getItem('shaya_quiz_name') || prompt('Enter your name:') || 'Player';
  localStorage.setItem('shaya_quiz_name', myName);
}
document.getElementById('name').innerText = myName + ' (' + myId + ')';
let state = { points:0, playPoints:0, dailyPoints:0, q_index:0, correct:0, wrong:0, last_claim:null };
function saveLocal(){ localStorage.setItem('shaya_quiz_backup_' + myId, JSON.stringify(state)); }
function loadLocal(){ try{ let s = JSON.parse(localStorage.getItem('shaya_quiz_backup_' + myId)); if(s) state = {...state, ...s}; }catch{} }
loadLocal();
async function syncToServer(){
  saveLocal();
  try{ await fetch('/api/sync', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: myId, name: myName, first_name: myName, points: state.points, playPoints: state.playPoints, dailyPoints: state.dailyPoints, q_index: state.q_index, correct: state.correct, wrong: state.wrong, last_claim: state.last_claim}) }); }catch{}
}
async function loadFromServer(){
  try{
    let r = await fetch('/api/user/' + myId); let d = await r.json();
    // MAX merge - like Watch: keep highest of local vs server
    state.points = Math.max(state.points, d.points||0);
    state.playPoints = Math.max(state.playPoints, d.playPoints||0);
    state.dailyPoints = Math.max(state.dailyPoints, d.dailyPoints||0);
    state.q_index = Math.max(state.q_index, d.q_index||0);
    state.correct = Math.max(state.correct, d.correct||0);
    state.wrong = Math.max(state.wrong, d.wrong||0);
    if(d.last_claim) state.last_claim = d.last_claim;
    saveLocal(); render();
  }catch{}
}
function render(){ document.getElementById('points').innerText = state.points; document.getElementById('play').innerText = state.playPoints; document.getElementById('daily').innerText = state.dailyPoints; }
async function claimDaily(){
  let r = await fetch('/api/claim', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: myId, name: myName})});
  let d = await r.json();
  if(d.ok){ state.dailyPoints = d.dailyPoints; state.points = d.points; state.last_claim = new Date().toDateString(); saveLocal(); render(); alert('Claimed 200!'); } else alert(d.error||'Failed');
}
const QUESTIONS = [{q:'Capital of South Africa?', a:['Pretoria','Cape Town','Durban'], c:0},{q:'2 + 2 = ?', a:['3','4','5'], c:1},{q:'Largest ocean?', a:['Atlantic','Pacific','Indian'], c:1}];
function playQuiz(){
  let cur = QUESTIONS[state.q_index % QUESTIONS.length];
  document.getElementById('q').innerText = cur.q;
  document.getElementById('answers').innerHTML = cur.a.map((x,i)=>`<button onclick="answer(${i})">${x}</button>`).join('');
}
async function answer(i){
  let cur = QUESTIONS[state.q_index % QUESTIONS.length];
  if(i===cur.c){ state.points+=10; state.playPoints+=10; state.correct++; alert('Correct +10'); } else { state.wrong++; alert('Wrong'); }
  state.q_index++; saveLocal(); render(); await syncToServer(); playQuiz();
}
async function withdraw(){
  let wallet = prompt('Enter wallet / number:'); if(!wallet) return;
  let r = await fetch('/api/withdraw', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: myId, name: myName, method:'Cash', wallet, rand:0})});
  let d = await r.json(); if(d.ok){ state.points = d.points; saveLocal(); render(); alert('Withdraw request sent!'); } else alert(d.error);
}
async function showLeaderboard(){ let r = await fetch('/api/leaderboard'); let d = await r.json(); document.getElementById('board').innerHTML = d.map((x,i)=>`${i+1}. ${x.name} - ${x.points}`).join('<br>'); }
loadFromServer(); render();
// Auto-sync every 10s like Watch
setInterval(syncToServer, 10000);
</script></body></html>
